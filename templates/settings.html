<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — {{ shop.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

<!-- Background deco overlay -->
<div class="page-deco no-print"></div>

<!-- Navbar -->
<nav class="navbar no-print">
  <a class="navbar-brand" href="{{ url_for('dashboard') }}">
    <span style="font-size:1.5rem">🌸</span>
    <span>{{ shop.name }}</span>
  </a>
  <div class="navbar-right">
    <a href="{{ url_for('dashboard') }}" class="btn-back">← Dashboard</a>
    <a href="{{ url_for('logout') }}" class="btn-logout">🚪 Logout</a>
  </div>
</nav>

<!-- Toast -->
<div class="toast-container" id="toast-container"></div>

<div class="page-wrapper animate-page">

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="flash-list">
        {% for cat, msg in messages %}
          <li class="flash-item flash-{{ cat }}">{{ msg }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <div class="page-title title-anim"><span>⚙️</span> Settings</div>

  <!-- Change Password -->
  <div class="card card-anim card-anim-1" style="margin-bottom:1.25rem">
    <div class="card-header">🔐 Change Admin Password</div>
    <div class="card-body">
      <form method="post" action="{{ url_for('settings') }}">
        <input type="hidden" name="action" value="change_password" />

        <div class="form-group">
          <label class="form-label" for="current-password">Current Password</label>
          <input type="password" id="current-password" name="current_password"
                 class="form-control" placeholder="Enter current password"
                 autocomplete="current-password" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="new-password">New Password</label>
          <input type="password" id="new-password" name="new_password"
                 class="form-control" placeholder="Min. 6 characters"
                 autocomplete="new-password" required minlength="6" />
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm New Password</label>
          <input type="password" id="confirm-password" name="confirm_password"
                 class="form-control" placeholder="Re-enter new password"
                 autocomplete="new-password" required minlength="6" />
        </div>

        <button type="submit" class="btn btn-primary">🔑 Update Password</button>
      </form>
    </div>
  </div>
